; BEME upper-arm wearable firmware.
; Hardware brief, pin map, and bring-up checklist: readme.md
; Coding conventions and scaffolding log: DEVELOPMENT.md

[platformio]
; Windows' 260-char MAX_PATH can be exceeded once a library's own example
; filenames (e.g. SparkFun MAX3010x's Example7_Basic_Readings_Interrupts)
; nest under this project's path, which is already deep (git worktree under
; .claude/worktrees/...). Redirect PlatformIO's library/build caches to a
; short path under the user profile instead of relying on Windows long-path
; support being enabled system-wide. See DEVELOPMENT.md "Windows build path
; workaround".
libdeps_dir = ${sysenv.USERPROFILE}\.pio-libdeps\wearable-pgd
build_dir = ${sysenv.USERPROFILE}\.pio-build\wearable-pgd

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; The esp32-s3-devkitc-1 board definition assumes 8MB flash
; (upload.flash_size=8MB, default_8MB.csv) — that's a devkit-board default,
; not this project's hardware. The actual ESP32-S3 SuperMini units this
; targets have 4MB flash; left at the board default, the built binary's
; embedded flash-size header (8MB) disagrees with the real chip at boot,
; which esp-idf's flash init treats as fatal ("Detected size(4096k) smaller
; than the size in the binary image header(8192k). Probe failed." / "assert
; failed: do_core_init") — a real bring-up failure caught on first hardware
; flash, not a hypothetical. default.csv (the framework's stock 4MB-sized
; table: nvs/otadata/ota_0/ota_1/spiffs/coredump, OTA-capable) fits this
; project's ~1MB image with headroom; see DEVELOPMENT.md.
board_upload.flash_size = 4MB
board_build.partitions = default.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3

    ; --- TFT_eSPI config for the shared ST7735 panel (readme.md #8.1, #8.3) ---
    ; Set via build_flags instead of editing the library's User_Setup.h, so a
    ; `pio lib update` never silently reverts the pin map.
    -D USER_SETUP_LOADED=1
    ; Forces TFT_eSPI's raw-register SPI macros (Processors/TFT_eSPI_ESP32_S3.h)
    ; to use the correct GPSPI2 peripheral index (2) instead of deriving it
    ; from the Arduino core's own `FSPI` macro. On this installed core, `FSPI`
    ; is 0 for S3-family chips (a different numbering than the raw peripheral
    ; index TFT_eSPI's SPI_USER_REG()/etc. macros expect) — left unset,
    ; SPI_USER_REG(0) resolves to address 0x10 (REG_SPI_BASE() explicitly
    ; returns 0 for any index below 2, since 0/1 are the internal flash/PSRAM
    ; buses), and the very first raw-register write in TFT_eSPI::init() faults
    ; with StoreProhibited at 0x10 — a real first-hardware-flash crash, traced
    ; to this exact line via addr2line against the built ELF, not guessed.
    ; See DEVELOPMENT.md's dated entry.
    -D USE_FSPI_PORT=1
    -D ST7735_DRIVER=1
    ; TODO confirm the correct tab variant at bring-up (readme.md #11.1); swap
    ; for ST7735_REDTAB / ST7735_BLACKTAB / ST7735_GREENTAB2 etc. if the
    ; visible window is off (offset/cropped) — separate from colour order.
    -D ST7735_GREENTAB=1
    ; Confirmed on real hardware (readme.md #11): renderAlert()'s TFT_RED
    ; background displayed as blue. ST7735_Defines.h defaults GREENTAB to
    ; BGR order when TFT_RGB_ORDER isn't set — wrong for this panel, which
    ; needs RGB. TFT_RGB_ORDER is an int (1=RGB, else=BGR), not a symbolic
    ; TFT_RGB/TFT_BGR macro — confirmed by reading the driver header
    ; directly rather than assumed.
    -D TFT_RGB_ORDER=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=4
    -D TFT_RST=5
    -D TFT_BL=6
    -D TOUCH_CS=-1   ; touch is driven by its own XPT2046 library, not TFT_eSPI
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000

    ; TODO once PSRAM is confirmed fitted on the specific SuperMini unit
    ; (readme.md #11.4), add: -D BOARD_HAS_PSRAM

lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.0
    adafruit/Adafruit MLX90614 Library@^2.1.0
    ; No LIS3DH/Unified Sensor libraries — the Motion sensor is an LIS3DSH,
    ; driven directly over I2C in src/sensors/motion_lis3dsh.cpp (no
    ; library exists for it worth depending on; see that file's comment).
    adafruit/Adafruit MAX1704X@^1.0.0
    h2zero/NimBLE-Arduino@^2.1.0
    adafruit/Adafruit NeoPixel@^1.12.0
